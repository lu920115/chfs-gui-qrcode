name: Sync Windows EXE Release from source

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version already published in lu920115/chfsgui
        required: true
        default: 1.5.5
        type: string

permissions:
  contents: write

concurrency:
  group: sync-windows-exe-release-from-source
  cancel-in-progress: false

jobs:
  sync-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download and verify the exact source Release assets
        env:
          APP_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub normalizes non-ASCII Release asset names; keep the local
          # artifact filename Chinese, but download the actual Release name.
          asset="CHFS3.1_GUI._v${APP_VERSION}.exe"
          gh release download "v${APP_VERSION}" --repo lu920115/chfsgui \
            --pattern "$asset" --pattern "$asset.sha256.txt" --dir release-assets
          cd release-assets
          expected="$(awk 'NR == 1 {print $1}' "$asset.sha256.txt")"
          actual="$(sha256sum "$asset" | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"
          printf '%s: OK\n' "$asset"
          test "$(head -c 2 "$asset")" = 'MZ'

      - name: Publish the identical assets to this repository Release
        env:
          APP_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release-assets
          asset="CHFS3.1_GUI._v${APP_VERSION}.exe"
          gh release create "v${APP_VERSION}" "$asset" "$asset.sha256.txt" \
            --repo "$GH_REPO" --target main \
            --title "CHFS 3.1 Qrcode V${APP_VERSION}" \
            --notes 'Windows x64 单文件静态版；与源码仓库 Release 文件完全一致。SHA-256 校验文件随附。'
