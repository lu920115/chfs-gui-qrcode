name: Sync Windows EXE from source

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already built in lu920115/chfsgui
        required: true
        default: 1.5.4
        type: string

permissions:
  contents: write

concurrency:
  group: sync-windows-exe-from-source
  cancel-in-progress: false

jobs:
  sync-exe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out EXE repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Download and verify the exact source EXE
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          name="CHFS3.1_GUI二维码增强版_v${APP_VERSION}.exe"
          base='https://raw.githubusercontent.com/lu920115/chfsgui/master'
          curl -fL --retry 3 --retry-delay 5 "$base/$name" -o "$name"
          curl -fL --retry 3 --retry-delay 5 "$base/$name.sha256.txt" -o "$name.sha256.txt"
          sha256sum -c "$name.sha256.txt"
          test "$(head -c 2 "$name")" = 'MZ'

      - name: Commit the identical EXE copy
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          name="CHFS3.1_GUI二维码增强版_v${APP_VERSION}.exe"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$name" "$name.sha256.txt"
          if git diff --cached --quiet; then
            echo 'The EXE and checksum are already up to date.'
            exit 0
          fi
          git commit -m "Sync v${APP_VERSION} Windows EXE"
          git push origin HEAD:main
