name: Sync Windows EXE Release from source

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version already published in lu920115/chfsgui
        required: true
        default: 1.5.5
        type: string

permissions:
  contents: write

concurrency:
  group: sync-windows-exe-release-from-source
  cancel-in-progress: false

jobs:
  sync-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download and verify the exact source Release assets
        env:
          APP_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="CHFS3.1_GUI二维码增强版_v${APP_VERSION}.exe"
          gh release download "v${APP_VERSION}" --repo lu920115/chfsgui \
            --pattern "$name" --pattern "$name.sha256.txt" --dir release-assets
          cd release-assets
          sha256sum -c "$name.sha256.txt"
          test "$(head -c 2 "$name")" = 'MZ'

      - name: Publish the identical assets to this repository Release
        env:
          APP_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release-assets
          name="CHFS3.1_GUI二维码增强版_v${APP_VERSION}.exe"
          gh release create "v${APP_VERSION}" "$name" "$name.sha256.txt" \
            --repo "$GH_REPO" --target main \
            --title "CHFS 3.1 Qrcode V${APP_VERSION}" \
            --notes 'Windows x64 单文件静态版；与源码仓库 Release 文件完全一致。SHA-256 校验文件随附。'
